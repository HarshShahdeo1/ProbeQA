server {
    listen 80;
    server_name localhost;

    # Docker internal DNS resolver (enables dynamic resolution without boot-time crash)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # Serve static assets compiled by Vite
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend container over internal Docker network
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy health checks
    location /health {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    # Proxy screenshot evidence files
    location /evidence/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    # Proxy Prometheus metrics
    location /metrics {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }
}
