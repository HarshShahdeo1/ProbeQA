# monitoring/prometheus-docker.yml
# Docker-specific Prometheus configuration for ProbeQA containerized network.
# Scrapes the backend container using its Docker service hostname: 'backend:8000'.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Scrape ProbeQA Backend via internal Docker network service discovery
  - job_name: "probeqa"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["backend:8000"]
        labels:
          app: "probeqa"
          env: "docker"
