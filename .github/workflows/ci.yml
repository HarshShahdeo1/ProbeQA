name: ProbeQA CI Pipeline

on:
  push:
    branches: [ main, master, development ]
  pull_request:
    branches: [ main, master, development ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Backend Testing Job ──────────────────────────────────────────────────
  test-backend:
    name: Backend Unit & Observability Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run SQLite Persistence & Schema Migration Tests
        run: python backend/test_database.py

      - name: Run Prometheus Metrics & Telemetry Tests
        run: python backend/test_metrics.py

      - name: Run Deterministic Agent Evaluation Benchmark (Mock Mode)
        run: python backend/evaluation_suite.py --mode=mock

  # ── 2. Frontend Build Job ───────────────────────────────────────────────────
  test-frontend:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run production build (Vite)
        run: npm run build

  # ── 3. Docker Verification Job ──────────────────────────────────────────────
  docker-build:
    name: Validate Docker Compose & Image Builds
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        env:
          GF_SECURITY_ADMIN_PASSWORD: ci_validation_placeholder_not_a_real_secret
        run: docker compose config

      - name: Build Backend Docker Image
        run: |
          docker build \
            --tag probeqa-backend:ci \
            ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build \
            --tag probeqa-frontend:ci \
            .
